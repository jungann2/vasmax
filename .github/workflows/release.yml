name: Verify published release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string

# Verify artifacts built from the private repository.
# Never compile public source or write/overwrite Release assets.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release checksums and executable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir artifacts
          gh release download "${RELEASE_TAG}" --repo "${RELEASE_REPO}" \
            --pattern 'VasmaX_linux_amd64' --pattern 'VasmaX_linux_amd64.sha256' \
            --pattern 'VasmaX_linux_arm64' --pattern 'VasmaX_linux_arm64.sha256' \
            --dir artifacts
          cd artifacts
          sha256sum --check VasmaX_linux_amd64.sha256
          sha256sum --check VasmaX_linux_arm64.sha256
          chmod 0755 VasmaX_linux_amd64
          [[ "$(./VasmaX_linux_amd64 --version)" == "VasmaX ${RELEASE_TAG}" ]]
