name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUTPUT="VasmaX_linux_${{ matrix.goarch }}"
          go build -ldflags "-s -w -X main.version=${VERSION}" -o "${OUTPUT}" ./cmd/vasmax/
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VasmaX_linux_${{ matrix.goarch }}
          path: |
            VasmaX_linux_${{ matrix.goarch }}
            VasmaX_linux_${{ matrix.goarch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            VasmaX_linux_amd64
            VasmaX_linux_amd64.sha256
            VasmaX_linux_arm64
            VasmaX_linux_arm64.sha256
